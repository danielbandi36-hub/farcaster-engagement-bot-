name: Token Price Alert Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-price-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install @neynar/nodejs-sdk
        
      - name: Run price bot
        env:
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
          SIGNER_UUID: ${{ secrets.SIGNER_UUID }}
        run: node price-bot.js
